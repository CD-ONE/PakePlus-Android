name: Android Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Init Project Config
        run: |
          pnpm install
          pnpm pp:worker
        env:
          PNPM_CONFIG_STRICT_DEP_BUILDS: 'false'

      - name: Export PakePlus env vars
        run: |
          echo "NAME=$(node -p "require('./scripts/ppconfig.json').name || 'app'")" >> $GITHUB_ENV
          echo "VERSION=$(node -p "require('./scripts/ppconfig.json').version || '1.0.0'")" >> $GITHUB_ENV
          echo "PUBBODY=$(node -p "require('./scripts/ppconfig.json').pubBody || ''")" >> $GITHUB_ENV

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk "${{ env.NAME || 'app' }}-v${{ env.VERSION || '1.0.0' }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ env.NAME || 'android-build' }}-${{ github.run_number }}
          name: ${{ env.NAME || 'Android Build' }} v${{ env.VERSION || '1.0.0' }}
          body: ${{ env.PUBBODY }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
